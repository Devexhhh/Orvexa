services:

  postgres:
    image: postgres:17
    container_name: orvexa-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orvexa

    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: orvexa-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: orvexa-backend

    ports:
      - "3000:3000"

    depends_on:
      - postgres
      - redis

    env_file:
      - .env.docker

    dns:
      - 8.8.8.8
      - 1.1.1.1